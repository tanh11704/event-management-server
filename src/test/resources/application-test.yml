spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  mail:
    host: localhost
    port: 587
    username: test@test.com
    password: test

jwt:
  issuer: test-issuer
  audience: test-audience
  access-token:
    secret: testAccessSecretKeyForTestingOnlyMustBeAtLeast32CharactersLong
    expiration: 1800000
  refresh-token:
    secret: testRefreshSecretKeyForTestingOnlyMustBeAtLeast32CharactersLong
    expiration: 604800000

api:
  prefix: /api/v1

logging:
  level:
    org.hibernate: WARN
    org.flywaydb: WARN
