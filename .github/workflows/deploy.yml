name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  check-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Code Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Check Code Style (Checkstyle)
        run: ./gradlew checkstyleMain

      - name: Run Tests
        run: ./gradlew test

  build-push-deploy:
    runs-on: ubuntu-latest
    needs: check-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/eventmanagement-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/eventmanagement-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/eventmanagement-api:buildcache,mode=max

      - name: Copy docker-compose to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.GCP_USERNAME }}/app/"

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.GCP_USERNAME }}/app/

            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> .env
            echo "JWT_ACCESS_SECRET=${{ secrets.PROD_JWT_ACCESS }}" >> .env
            echo "JWT_REFRESH_SECRET=${{ secrets.PROD_JWT_REFRESH }}" >> .env

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health check
            echo "Waiting for application to be healthy..."
            timeout=60
            elapsed=0
            while [ $elapsed -lt $timeout ]; do
              if docker compose -f docker-compose.prod.yml ps | grep -q "healthy"; then
                echo "Application is healthy!"
                break
              fi
              sleep 5
              elapsed=$((elapsed + 5))
            done

            # Clean up old images
            docker image prune -f
